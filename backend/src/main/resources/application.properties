spring.application.name=FactoryLink
# 固定数据库名，防止把 Hibernate 的建表操作应用到其他业务库。
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/factory_link?characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 默认仅供本机开发，通过同源 Vite 代理访问，浏览器无需跨域配置。
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.web.error.include-message=never
factory.simulation.interval-ms=5000
factory.demo.username=${DEMO_USERNAME:operator}
factory.demo.password=${DEMO_PASSWORD:}
